[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exam-padder"
version = "0.1.0"
description = "Insert handwriting whitespace after each question in Vietnamese high-school Math exam PDFs."
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF>=1.24",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "Pillow>=10.0",
    "img2pdf>=0.5",
    "Unidecode>=1.3",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
ocr = ["paddleocr>=2.7"]
ui = ["gradio>=4.0"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
exam-padder = "exam_padder.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
